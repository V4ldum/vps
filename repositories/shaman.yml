# Keeps the image digest up-to-date
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
    name: shaman
    namespace: flux-system
    annotations:
        fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
    type: OCIArtifactTag
    url: oci://ghcr.io/v4ldum/shaman
    filter:
        includeTag: "^latest$"
        limit: 1
    secretRef:
        name: ghcr

---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
    name: shaman
    namespace: flux-system
spec:
    inputsFrom:
      - kind: ResourceSetInputProvider
        name: shaman
    resources:
        # Keeps the manifest up-to-date
      - apiVersion: source.toolkit.fluxcd.io/v1
        kind: GitRepository
        metadata:
            name: shaman
            namespace: flux-system
        spec:
            interval: 5m
            url: https://github.com/V4ldum/is-shaman-good
            ref:
                branch: main
            ignore: |
                /*
                !/kubernetes.yml
            secretRef:
                name: github
        # Keeps the image up-to-date with the digest from RSIP
      - apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
            name: shaman
            namespace: flux-system
        spec:
            interval: 5m
            path: ./
            prune: true
            targetNamespace: default
            sourceRef:
                kind: GitRepository
                name: shaman
            images:
              - name: ghcr.io/v4ldum/shaman
                digest: << inputs.digest | quote >>
