# Keeps the image digest up-to-date
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
    name: backoffice
    namespace: flux-system
    annotations:
        fluxcd.controlplane.io/reconcile: "enabled"
        fluxcd.controlplane.io/reconcileEvery: "24h"
        fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
    type: OCIArtifactTag
    url: oci://ghcr.io/v4ldum/backoffice
    filter:
        includeTag: "^latest$"
        limit: 1
    secretRef:
        name: ghcr

---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
    name: backoffice
    namespace: flux-system
    annotations:
        fluxcd.controlplane.io/reconcile: "enabled"
        fluxcd.controlplane.io/reconcileEvery: "24h"
        fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
    inputsFrom:
      - kind: ResourceSetInputProvider
        name: backoffice
    resources:
        # Keeps the manifest up-to-date
      - apiVersion: source.toolkit.fluxcd.io/v1
        kind: GitRepository
        metadata:
            name: backoffice
            namespace: flux-system
        spec:
            url: https://github.com/V4ldum/backoffice
            ref:
                branch: main
            ignore: |
                /*
                !/kubernetes.yml
            secretRef:
                name: github
            interval: 24h
            timeout: 5m
        # Keeps the image up-to-date with the digest from RSIP
      - apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
            name: backoffice
            namespace: flux-system
        spec:
            path: ./
            prune: true
            targetNamespace: default
            sourceRef:
                kind: GitRepository
                name: backoffice
            images:
              - name: ghcr.io/v4ldum/backoffice
                digest: << inputs.digest | quote >>
            interval: 24h
            retryInterval: 5m
            timeout: 5m
