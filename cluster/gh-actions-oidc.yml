apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
    name: gh-actions-role-binding
    namespace: default

subjects:
  - kind: Group
    name: "github:56064897"

roleRef:
    name: gh-actions-role
    kind: Role
    apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
    name: gh-actions-role
    namespace: default

rules:
  - apiGroups: ["", "apps", "networking.k8s.io", "batch"]
    resources: ["deployments", "services", "ingresses", "configmaps", "cronjobs"]
    verbs: ["get", "list", "watch", "patch", "create", "delete"]

---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
    name: kube-api
    namespace: default
    annotations:
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.entrypoints: websecure

spec:
    ingressClassName: traefik
    rules:
      - host: kube.valdum.dev
        http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                    service:
                        name: kubernetes
                        port:
                            name: https
