name: CI/CD
on:
    workflow_dispatch:
    push:
        branches:
            - "main"
        paths:
            - dozzle.yml

permissions:
    contents: read
    id-token: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        uses: v4ldum/shared-workflows/.github/workflows/deploy.yml@main
        secrets: inherit
        with:
            project: dozzle
