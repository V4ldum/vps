apiVersion: v1
kind: Service

metadata:
    name: dozzle

spec:
    type: NodePort
    selector:
        app: dozzle
    ports:
      - protocol: TCP
        port: 8080
        targetPort: 8080
        nodePort: 30001

---
apiVersion: v1
kind: ConfigMap

metadata:
    name: dozzle-config

data:
    users.yml: |
        # Password is '12345', don't use this in production ofc
        users:
            admin:
                name: Admin
                password: $2a$11$Uz8WY9IhT45pxw00l1eaCe.EwZUCuosi3HThN1gBNk8Hkm4kgEiBW

---
apiVersion: apps/v1
kind: Deployment

metadata:
    name: dozzle

spec:
    selector:
        matchLabels:
            app: dozzle

    template:
        metadata:
            labels:
                app: dozzle

        spec:
            serviceAccountName: dozzle-sa

            containers:
              - name: dozzle
                image: amir20/dozzle:latest
                imagePullPolicy: Always

                ports:
                  - containerPort: 8080

                env:
                  - name: DOZZLE_MODE
                    value: k8s
                  - name: DOZZLE_AUTH_PROVIDER
                    value: simple
                  - name: DOZZLE_FILTER
                    value: dozzle=true

                volumeMounts:
                  - name: data
                    mountPath: /data

            volumes:
              - name: data
                configMap:
                  name: dozzle-config

---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: dozzle-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: dozzle-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: dozzle-binding
subjects:
  - kind: ServiceAccount
    name: dozzle-sa
    namespace: default
roleRef:
    kind: ClusterRole
    name: dozzle-role
    apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment

metadata:
    name: nginx

spec:
    selector:
        matchLabels:
            app: nginx

    template:
        metadata:
            labels:
                app: nginx
                dozzle: "true"

        spec:
            containers:
              - name: nginx
                image: nginx:latest
                imagePullPolicy: Always

                ports:
                  - containerPort: 8080

---
apiVersion: batch/v1
kind: CronJob

metadata:
    name: hello

spec:
    schedule: "*/5 * * * *"
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1

    jobTemplate:
        spec:
            template:
                metadata:
                    labels:
                        dozzle: "true"

                spec:
                    restartPolicy: Never

                    containers:
                      - name: hello
                        image: python:3-slim
                        imagePullPolicy: IfNotPresent

                        command:
                          - python
                          - -c
                          - print("hello")
