---
apiVersion: v1
kind: Namespace
metadata:
    name: "keel"

---
apiVersion: v1
kind: Service
metadata:
    name: keel
    namespace: "keel"
    labels:
        app: keel
spec:
    type: LoadBalancer
    sessionAffinity: None
    selector:
        app: keel
    ports:
      - name: http-out
        protocol: TCP
        port: 9300
        targetPort: http-in

---
apiVersion: apps/v1
kind: Deployment

metadata:
    name: keel
    namespace: "keel"
    labels:
        app: keel

spec:
    replicas: 1
    minReadySeconds: 15
    revisionHistoryLimit: 1

    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0

    selector:
        matchLabels:
            app: keel

    template:
        metadata:
            labels:
                app: keel

        spec:
            serviceAccountName: keel

            containers:
              - name: keel
                image: "keelhq/keel:latest"
                imagePullPolicy: Always
                command: ["/bin/keel"]

                ports:
                  - name: http-in
                    containerPort: 9300

                env:
                  - name: NAMESPACE
                    valueFrom:
                        fieldRef:
                            fieldPath: metadata.namespace

                livenessProbe:
                    initialDelaySeconds: 30
                    timeoutSeconds: 10
                    httpGet:
                        path: /healthz
                        port: http-in

                resources:
                    limits:
                        cpu: 100m
                        memory: 128Mi
                    requests:
                        cpu: 50m
                        memory: 64Mi

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
    name: keel
    namespace: "keel"
spec:
    maxUnavailable: 1
    selector:
        matchLabels:
            app: keel

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: keel
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["", "extensions", "apps", "batch"]
    resources: ["pods", "replicasets", "replicationcontrollers", "statefulsets", "deployments", "jobs", "cronjobs"]
    verbs: ["get", "delete", "watch", "list", "update"]
  - apiGroups: [""]
    resources: ["configmaps", "pods/portforward"]
    verbs: ["get", "create", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: keel
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: keel
subjects:
  - kind: ServiceAccount
    name: keel
    namespace: "keel"

---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: keel
    namespace: "keel"
    labels:
        app: keel
