apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
    name: flux
    namespace: flux-system
    annotations:
        fluxcd.controlplane.io/reconcile: "enabled"
        fluxcd.controlplane.io/reconcileEvery: "24h"
        fluxcd.controlplane.io/reconcileArtifactEvery: "168h"
        fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
    distribution:
        version: "2.x"
        registry: "ghcr.io/fluxcd"
        artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
    components:
      - source-controller
      - kustomize-controller
      - notification-controller
    cluster:
        type: kubernetes
        size: small
    sync:
        kind: GitRepository
        url: "https://github.com/v4ldum/vps"
        ref: "refs/heads/main"
        path: "./"
        pullSecret: "ghcr"
        interval: 24h
    kustomize:
        patches:
            # sync.interval only applies to the GitRepository, the generated Kustomization is hardcoded to 10m
          - target:
                kind: Kustomization
                name: flux-system
            patch: |
                - op: replace
                  path: /spec/interval
                  value: 24h
                - op: add
                  path: /spec/retryInterval
                  value: 5m
                - op: add
                  path: /spec/timeout
                  value: 5m
            # Aligns the timeout with the app GitRepositories (default is 60s)
          - target:
                kind: GitRepository
                name: flux-system
            patch: |
                - op: add
                  path: /spec/timeout
                  value: 5m

---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
    name: flux-webhook-receiver
    namespace: flux-system
    annotations:
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.entrypoints: websecure

spec:
    ingressClassName: traefik
    rules:
      - host: flux.valdum.dev
        http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                    service:
                        name: webhook-receiver
                        port:
                            number: 80
